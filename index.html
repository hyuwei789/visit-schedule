<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每週探班排表</title>
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入 React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- 載入 Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ⚠️ 關鍵設定：Google Apps Script Web 應用程式網址
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzTao0czCyqFFqX6UhKfWTBZ_S4eaRTwpDQZH6ygN50gZ_tBeXXi1rSpfLhR9s8cq3R/exec";

    // --- 圖示組件 ---
    const IconSun = () => <svg className="w-5 h-5 text-amber-500 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>;
    const IconMoon = () => <svg className="w-5 h-5 text-indigo-500 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>;
    const IconUsers = () => <svg className="w-5 h-5 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>;
    const IconUser = () => <svg className="w-5 h-5 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>;
    const IconCalendar = () => <svg className="w-5 h-5 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>;
    const IconChevronLeft = () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M15 19l-7-7 7-7" /></svg>;
    const IconChevronRight = () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M9 5l7 7-7 7" /></svg>;
    const IconCopy = () => <svg className="w-4 h-4 inline mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>;

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(date.setDate(diff));
      monday.setHours(0, 0, 0, 0);
      return monday;
    }

    function formatDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getWeekDays(monday) {
      const days = [];
      const dayNames = ['一', '二', '三', '四', '五', '六', '日'];
      for (let i = 0; i < 7; i++) {
        const date = new Date(monday);
        date.setDate(monday.getDate() + i);
        const month = date.getMonth() + 1;
        const dayNum = date.getDate();
        days.push({
          key: `day_${i}`,
          name: `週${dayNames[i]}`,
          dateStr: `${month}/${dayNum}`
        });
      }
      return days;
    }

    function App() {
      const [currentMonday, setCurrentMonday] = useState(() => getMonday(new Date()));
      const [selectedMonth, setSelectedMonth] = useState(() => new Date(new Date().getFullYear(), new Date().getMonth(), 1));
      const [users, setUsers] = useState(['成員A', '成員B']);
      const [activeUser, setActiveUser] = useState('成員A');
      const [newUserInput, setNewUserInput] = useState('');
      const [schedules, setSchedules] = useState({});
      const [viewMode, setViewMode] = useState('my-schedule'); // 'my-schedule' | 'team-summary' | 'month-summary'
      const [copied, setCopied] = useState(false);
      
      const [syncStatus, setSyncStatus] = useState('loading');

      useEffect(() => {
        if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("YOUR_GOOGLE_APPS_SCRIPT_URL_HERE")) {
          setSyncStatus('error');
          return;
        }

        setSyncStatus('loading');
        fetch(GOOGLE_SCRIPT_URL)
          .then(res => res.json())
          .then(data => {
            if (data.users && Array.isArray(data.users)) setUsers(data.users);
            if (data.schedules) setSchedules(data.schedules);
            if (data.users && data.users.length > 0) setActiveUser(data.users[0]);
            setSyncStatus('synced');
          })
          .catch(err => {
            console.error(err);
            setSyncStatus('error');
          });
      }, []);

      const saveToCloud = (updatedUsers, updatedSchedules) => {
        if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("YOUR_GOOGLE_APPS_SCRIPT_URL_HERE")) return;
        setSyncStatus('saving');
        
        const payload = JSON.stringify({
          users: updatedUsers,
          schedules: updatedSchedules
        });

        fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          body: payload
        })
          .then(res => res.json())
          .then(data => {
            if (data.status === 'success') {
              setSyncStatus('synced');
            } else {
              setSyncStatus('error');
            }
          })
          .catch(err => {
            console.error(err);
            setSyncStatus('error');
          });
      };

      const weekKey = useMemo(() => formatDateKey(currentMonday), [currentMonday]);
      const weekDays = useMemo(() => getWeekDays(currentMonday), [currentMonday]);

      // 計算月排班的天數
      const monthDaysList = useMemo(() => {
        const year = selectedMonth.getFullYear();
        const month = selectedMonth.getMonth();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
        const list = [];

        for (let d = 1; d <= daysInMonth; d++) {
          const dateObj = new Date(year, month, d);
          list.push({
            dateObj,
            dayNum: d,
            dateStr: `${month + 1}/${d}`,
            dayName: `週${dayNames[dateObj.getDay()]}`,
            isWeekend: dateObj.getDay() === 0 || dateObj.getDay() === 6
          });
        }
        return list;
      }, [selectedMonth]);

      const changeWeek = (offsetWeeks) => {
        const nextMon = new Date(currentMonday);
        nextMon.setDate(nextMon.getDate() + offsetWeeks * 7);
        setCurrentMonday(nextMon);
      };

      const changeMonth = (offsetMonths) => {
        const nextM = new Date(selectedMonth.getFullYear(), selectedMonth.getMonth() + offsetMonths, 1);
        setSelectedMonth(nextM);
      };

      const resetToThisWeek = () => {
        setCurrentMonday(getMonday(new Date()));
      };

      const resetToThisMonth = () => {
        setSelectedMonth(new Date(new Date().getFullYear(), new Date().getMonth(), 1));
      };

      const getSlotState = (userName, dayKey, shiftType) => {
        if (!userName) return 'none';
        const userWeekData = schedules[weekKey]?.[userName] || {};
        const slotKey = `${dayKey}_${shiftType}`;
        return userWeekData[slotKey] || 'none';
      };

      // 查詢任意特定日期、特定使用者的狀態
      const getSlotStateByDate = (userName, dateObj, shiftType) => {
        if (!userName) return 'none';
        const mon = getMonday(dateObj);
        const wKey = formatDateKey(mon);
        const dayIdx = (dateObj.getDay() + 6) % 7; // 週一為 0, 週日為 6
        const userWeekData = schedules[wKey]?.[userName] || {};
        return userWeekData[`day_${dayIdx}_${shiftType}`] || 'none';
      };

      const toggleSlotState = (dayKey, shiftType) => {
        if (!activeUser) {
          alert('請先新增或選擇成員！');
          return;
        }
        const slotKey = `${dayKey}_${shiftType}`;
        const currentState = getSlotState(activeUser, dayKey, shiftType);
        
        let nextState = 'available';
        if (currentState === 'available') nextState = 'flexible';
        else if (currentState === 'flexible') nextState = 'none';

        const updatedSchedules = {
          ...schedules,
          [weekKey]: {
            ...(schedules[weekKey] || {}),
            [activeUser]: {
              ...((schedules[weekKey] || {})[activeUser] || {}),
              [slotKey]: nextState
            }
          }
        };

        setSchedules(updatedSchedules);
        saveToCloud(users, updatedSchedules);
      };

      const handleAddUser = (e) => {
        e.preventDefault();
        const trimmed = newUserInput.trim();
        if (trimmed && !users.includes(trimmed)) {
          const updatedUsers = [...users, trimmed];
          setUsers(updatedUsers);
          setActiveUser(trimmed);
          setNewUserInput('');
          saveToCloud(updatedUsers, schedules);
        }
      };

      const handleDeleteUser = (userName, e) => {
        e.stopPropagation();
        if (confirm(`確定要刪除「${userName}」嗎？`)) {
          const updatedUsers = users.filter(u => u !== userName);
          setUsers(updatedUsers);
          if (activeUser === userName) {
            setActiveUser(updatedUsers[0] || '');
          }
          saveToCloud(updatedUsers, schedules);
        }
      };

      const copyLineSummary = () => {
        let text = `📅 【每週探班排表】 ${weekDays[0].dateStr} ~ ${weekDays[6].dateStr}\n------------------------\n`;
        
        weekDays.forEach(day => {
          text += `\n📌 ${day.name} (${day.dateStr})\n`;
          ['morning', 'evening'].forEach(shift => {
            const shiftLabel = shift === 'morning' ? '☀️ 上午(10:30)' : '🌙 晚上(7:00)';
            const availableList = [];
            const flexibleList = [];

            users.forEach(u => {
              const state = getSlotState(u, day.key, shift);
              if (state === 'available') availableList.push(u);
              if (state === 'flexible') flexibleList.push(u + '(可彈性)');
            });

            const combined = [...availableList, ...flexibleList];
            text += `  ${shiftLabel}: ${combined.length > 0 ? combined.join(', ') : '無人'}\n`;
          });
        });

        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="max-w-4xl mx-auto p-4 sm:p-6">
          {/* 頂部標頭與同步狀態提示 */}
          <header className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
              <div className="flex items-center gap-3">
                <h1 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                  <IconCalendar /> 每週探班排表
                </h1>
                
                {syncStatus === 'loading' && <span className="text-xs bg-amber-50 text-amber-600 px-2 py-1 rounded-full animate-pulse">☁️ 資料載入中...</span>}
                {syncStatus === 'saving' && <span className="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded-full animate-pulse">🔄 同步至試算表中...</span>}
                {syncStatus === 'synced' && <span className="text-xs bg-emerald-50 text-emerald-600 px-2 py-1 rounded-full">☁️ 雲端同步完成</span>}
                {syncStatus === 'error' && <span className="text-xs bg-rose-50 text-rose-600 px-2 py-1 rounded-full">⚠️ 未設定雲端 API 網址</span>}
              </div>
              <p className="text-slate-500 text-sm mt-1">點選名字與有空時間，資料會自動即時儲存至 Google 試算表</p>
            </div>

            {/* 功能分頁按鈕 */}
            <div className="flex bg-slate-100 p-1 rounded-xl gap-1">
              <button
                onClick={() => setViewMode('my-schedule')}
                className={`px-3 py-2 rounded-lg text-xs sm:text-sm font-medium transition ${viewMode === 'my-schedule' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
              >
                <IconUser /> 個人登記
              </button>
              <button
                onClick={() => setViewMode('team-summary')}
                className={`px-3 py-2 rounded-lg text-xs sm:text-sm font-medium transition ${viewMode === 'team-summary' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
              >
                <IconUsers /> 週排班總覽
              </button>
              <button
                onClick={() => setViewMode('month-summary')}
                className={`px-3 py-2 rounded-lg text-xs sm:text-sm font-medium transition ${viewMode === 'month-summary' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
              >
                <IconCalendar /> 月排班總覽
              </button>
            </div>
          </header>

          {/* 週排班與個人登記的週別導覽 */}
          {viewMode !== 'month-summary' && (
            <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-6 flex flex-wrap justify-between items-center gap-3">
              <div className="flex items-center gap-2">
                <button onClick={() => changeWeek(-1)} className="p-2 hover:bg-slate-100 rounded-lg text-slate-600">
                  <IconChevronLeft />
                </button>
                <button onClick={resetToThisWeek} className="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg">
                  回到本週
                </button>
                <button onClick={() => changeWeek(1)} className="p-2 hover:bg-slate-100 rounded-lg text-slate-600">
                  <IconChevronRight />
                </button>
              </div>

              <div className="text-lg font-bold text-slate-800">
                {weekDays[0].dateStr} (一) ～ {weekDays[6].dateStr} (日)
              </div>

              <button 
                onClick={copyLineSummary}
                className="bg-emerald-50 text-emerald-600 hover:bg-emerald-100 px-3 py-2 rounded-xl text-sm font-medium transition flex items-center shadow-sm"
              >
                <IconCopy /> {copied ? '已複製！可到 LINE 貼上' : '複製 LINE 排班文字'}
              </button>
            </div>
          )}

          {/* 成員區 */}
          {viewMode !== 'month-summary' && (
            <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-6">
              <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">成員名單 (點選切換 / 按 ✕ 刪除)</div>
              <div className="flex flex-wrap items-center gap-2">
                {users.map(u => (
                  <div
                    key={u}
                    onClick={() => setActiveUser(u)}
                    className={`px-3 py-1.5 rounded-xl text-sm font-medium transition cursor-pointer flex items-center gap-2 ${activeUser === u ? 'bg-indigo-600 text-white shadow-md shadow-indigo-100' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                  >
                    <span>{u}</span>
                    <button
                      onClick={(e) => handleDeleteUser(u, e)}
                      className={`w-4 h-4 rounded-full flex items-center justify-center text-xs hover:bg-red-500 hover:text-white transition ${activeUser === u ? 'text-indigo-200' : 'text-slate-400'}`}
                    >
                      ✕
                    </button>
                  </div>
                ))}

                <form onSubmit={handleAddUser} className="flex items-center">
                  <input
                    type="text"
                    placeholder="+ 輸入名字 Enter"
                    value={newUserInput}
                    onChange={(e) => setNewUserInput(e.target.value)}
                    className="px-3 py-1.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 w-36"
                  />
                </form>
              </div>
            </div>
          )}

          {/* 區塊 1: 個人點選 */}
          {viewMode === 'my-schedule' && (
            <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
              <div className="flex justify-between items-center mb-4">
                <h2 className="text-lg font-bold text-slate-800">
                  {activeUser ? <>正在設定：<span className="text-indigo-600">{activeUser}</span> 的探班意願</> : '請先新增成員'}
                </h2>
                <div className="flex items-center gap-3 text-xs">
                  <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span> 🟢 可去</span>
                  <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-amber-400 inline-block"></span> 🟡 彈性/待定</span>
                  <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-slate-200 inline-block"></span> ⚪ 不便</span>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-7 gap-3">
                {weekDays.map(day => {
                  const mState = getSlotState(activeUser, day.key, 'morning');
                  const eState = getSlotState(activeUser, day.key, 'evening');

                  const getStyle = (state) => {
                    if (state === 'available') return 'bg-emerald-500 text-white shadow-sm';
                    if (state === 'flexible') return 'bg-amber-400 text-slate-900 shadow-sm';
                    return 'bg-slate-100 text-slate-400 hover:bg-slate-200';
                  };

                  return (
                    <div key={day.key} className="border border-slate-100 rounded-xl p-3 bg-slate-50/50 flex flex-col justify-between">
                      <div className="text-center mb-3">
                        <div className="font-bold text-slate-700">{day.name}</div>
                        <div className="text-xs text-slate-400">{day.dateStr}</div>
                      </div>

                      <div className="space-y-2">
                        <button
                          onClick={() => toggleSlotState(day.key, 'morning')}
                          className={`w-full py-2.5 px-2 rounded-lg font-medium text-xs flex items-center justify-center gap-1 transition ${getStyle(mState)}`}
                        >
                          <IconSun /> 上午
                        </button>

                        <button
                          onClick={() => toggleSlotState(day.key, 'evening')}
                          className={`w-full py-2.5 px-2 rounded-lg font-medium text-xs flex items-center justify-center gap-1 transition ${getStyle(eState)}`}
                        >
                          <IconMoon /> 晚上
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* 區塊 2: 週排班總覽 */}
          {viewMode === 'team-summary' && (
            <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 overflow-x-auto">
              <h2 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                <IconUsers /> 本週排班總覽【早(10:30)，晚(7:00)】
              </h2>

              <table className="w-full text-left border-collapse min-w-[600px]">
                <thead>
                  <tr className="border-b border-slate-200 text-slate-400 text-xs">
                    <th className="py-3 px-2 font-medium">成員</th>
                    {weekDays.map(day => (
                      <th key={day.key} className="py-3 px-2 text-center font-medium">
                        {day.name}<br/>
                        <span className="text-[10px] text-slate-400 font-normal">{day.dateStr}</span>
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 text-sm">
                  {users.length === 0 ? (
                    <tr>
                      <td colSpan="8" className="text-center py-6 text-slate-400">目前沒有成員，請先新增成員。</td>
                    </tr>
                  ) : (
                    users.map(u => (
                      <tr key={u} className="hover:bg-slate-50/50">
                        <td className="py-3 px-2 font-semibold text-slate-700">{u}</td>
                        {weekDays.map(day => {
                          const m = getSlotState(u, day.key, 'morning');
                          const e = getSlotState(u, day.key, 'evening');

                          const renderBadge = (type, state) => {
                            let bg = 'bg-slate-100 text-slate-300';
                            if (state === 'available') bg = 'bg-emerald-500 text-white font-bold';
                            if (state === 'flexible') bg = 'bg-amber-400 text-slate-900 font-bold';

                            return (
                              <span className={`text-[10px] px-1.5 py-0.5 rounded ${bg}`}>
                                {type === 'morning' ? '早' : '晚'}
                              </span>
                            );
                          };

                          return (
                            <td key={day.key} className="py-3 px-2 text-center">
                              <div className="flex justify-center items-center gap-1">
                                {renderBadge('morning', m)}
                                {renderBadge('evening', e)}
                              </div>
                            </td>
                          );
                        })}
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          )}

          {/* 區塊 3: 月排班總覽 (手機友善，直向卡片無須左右滑動) */}
          {viewMode === 'month-summary' && (
            <div className="space-y-4">
              {/* 月份導覽控制列 */}
              <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex flex-wrap justify-between items-center gap-3">
                <div className="flex items-center gap-2">
                  <button onClick={() => changeMonth(-1)} className="p-2 hover:bg-slate-100 rounded-lg text-slate-600">
                    <IconChevronLeft />
                  </button>
                  <button onClick={resetToThisMonth} className="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg">
                    回到本月
                  </button>
                  <button onClick={() => changeMonth(1)} className="p-2 hover:bg-slate-100 rounded-lg text-slate-600">
                    <IconChevronRight />
                  </button>
                </div>

                <div className="text-lg font-bold text-slate-800">
                  {selectedMonth.getFullYear()} 年 {selectedMonth.getMonth() + 1} 月
                </div>

                <div className="text-xs text-slate-400">
                  共 {monthDaysList.length} 天
                </div>
              </div>

              {/* 手機優化：直向響應式日期卡片瀑布流 */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                {monthDaysList.map(day => {
                  const mAvailable = [];
                  const mFlexible = [];
                  const eAvailable = [];
                  const eFlexible = [];

                  users.forEach(u => {
                    const mState = getSlotStateByDate(u, day.dateObj, 'morning');
                    const eState = getSlotStateByDate(u, day.dateObj, 'evening');

                    if (mState === 'available') mAvailable.push(u);
                    if (mState === 'flexible') mFlexible.push(u);

                    if (eState === 'available') eAvailable.push(u);
                    if (eState === 'flexible') eFlexible.push(u);
                  });

                  return (
                    <div 
                      key={day.dateStr} 
                      className={`bg-white rounded-xl p-4 shadow-sm border transition ${day.isWeekend ? 'border-amber-200 bg-amber-50/20' : 'border-slate-100'}`}
                    >
                      {/* 卡片日期標頭 */}
                      <div className="flex justify-between items-center pb-2 border-b border-slate-100 mb-2">
                        <span className="font-bold text-slate-800 text-base">
                          {day.dateStr} <span className={`text-xs px-1.5 py-0.5 rounded ${day.isWeekend ? 'bg-amber-100 text-amber-700' : 'text-slate-500'}`}>{day.dayName}</span>
                        </span>
                        <span className="text-[11px] text-slate-400">
                          {mAvailable.length + mFlexible.length + eAvailable.length + eFlexible.length > 0 ? '已有排班' : '無人填寫'}
                        </span>
                      </div>

                      {/* 早晚探班人員名單 */}
                      <div className="space-y-2 text-xs">
                        {/* 上午段 */}
                        <div className="flex items-start gap-2">
                          <span className="font-semibold text-amber-600 bg-amber-50 px-1.5 py-0.5 rounded whitespace-nowrap">
                            <IconSun /> 早 10:30
                          </span>
                          <div className="flex flex-wrap gap-1 items-center pt-0.5">
                            {mAvailable.map(u => (
                              <span key={u} className="bg-emerald-500 text-white font-medium px-2 py-0.5 rounded-full text-[11px]">
                                {u}
                              </span>
                            ))}
                            {mFlexible.map(u => (
                              <span key={u} className="bg-amber-400 text-slate-900 font-medium px-2 py-0.5 rounded-full text-[11px]">
                                {u}(彈性)
                              </span>
                            ))}
                            {mAvailable.length === 0 && mFlexible.length === 0 && (
                              <span className="text-slate-300">無</span>
                            )}
                          </div>
                        </div>

                        {/* 晚上段 */}
                        <div className="flex items-start gap-2">
                          <span className="font-semibold text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded whitespace-nowrap">
                            <IconMoon /> 晚 19:00
                          </span>
                          <div className="flex flex-wrap gap-1 items-center pt-0.5">
                            {eAvailable.map(u => (
                              <span key={u} className="bg-emerald-500 text-white font-medium px-2 py-0.5 rounded-full text-[11px]">
                                {u}
                              </span>
                            ))}
                            {eFlexible.map(u => (
                              <span key={u} className="bg-amber-400 text-slate-900 font-medium px-2 py-0.5 rounded-full text-[11px]">
                                {u}(彈性)
                              </span>
                            ))}
                            {eAvailable.length === 0 && eFlexible.length === 0 && (
                              <span className="text-slate-300">無</span>
                            )}
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
